name: Unpack and commit

on:
  push:
    branches: [main]
    paths:
      - '_incoming/*.zip'
      - '_incoming/**/*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zips
        run: |
          set -e
          while IFS= read -r z; do
            echo "Extraindo $z"
            unzip -o "$z" -d . -x '.github/*' '__MACOSX/*'
            rm -f "$z"
          done < <(find _incoming -type f -name '*.zip')

      - name: Commit
        run: |
          git config user.name "entrega-bot"
          git config user.email "entrega-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "Entrega automática"
            git push
          fi
          
