name: Build APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Unpack and commit"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MultiAbas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MultiAbas-APK
          path: MultiAbas.apk

      - name: Publicar versao (o app baixa daqui)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MultiAbas v${{ github.run_number }}
          files: MultiAbas.apk
          make_latest: true
          
